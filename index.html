<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Football Coin Shop BD</title>
    <style>
        :root {
            --bg-color: #111214;
            --card-bg: #1a1c1f;
            --accent-red: #ff3e3e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            color: var(--accent-red);
            font-size: 24px;
            letter-spacing: 1px;
        }
        .section {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .section-title {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 16px;
        }
        .step-number {
            background-color: var(--accent-red);
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 13px;
            color: white;
        }
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #25282c;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: var(--accent-red);
            outline: none;
        }
        .pkg-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .pkg-card {
            background: #25282c;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .pkg-card:hover {
            border-color: #555;
        }
        .pkg-card.active { 
            border-color: var(--accent-red); 
            background: rgba(255, 62, 62, 0.05);
        }
        .pkg-name { 
            font-weight: bold; 
            font-size: 14px;
        }
        .pkg-price { 
            color: var(--accent-red); 
            font-weight: bold; 
            margin-top: 8px; 
            font-size: 16px;
        }
        
        .pay-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
        }
        .pay-method { 
            background: #25282c; 
            padding: 15px; 
            border-radius: 10px; 
            text-align: center; 
            border: 2px solid #333; 
            cursor: pointer; 
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .pay-method.active { 
            border-color: var(--accent-red); 
            background: rgba(255, 62, 62, 0.05);
        }
        
        .payment-instructions {
            background: #25282c;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            color: #cbd5e1;
            text-align: center;
        }
        .payment-instructions span {
            color: #38bdf8;
            font-weight: bold;
        }

        .buy-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .buy-btn:hover {
            background: #e03131;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>E-FOOTBALL COIN SHOP BD</h2>
    </div>

    <!-- Step 1: Account Info -->
    <div class="section">
        <div class="section-title">
            <div class="step-number">1</div> Account Info
        </div>
        <div class="form-group">
            <label>Select Device</label>
            <select id="device">
                <option value="Android">Android</option>
                <option value="iOS">iOS</option>
            </select>
        </div>
        <div class="input-row">
            <div class="form-group">
                <label>Konami Mail</label>
                <input type="text" id="gmail" placeholder="Enter Konami Mail">
            </div>
            <div class="form-group">
                <label>Konami Password</label>
                <input type="password" id="pass" placeholder="Enter Password">
            </div>
        </div>
        <div class="form-group">
            <label>WhatsApp Number</label>
            <input type="text" id="whatsapp" placeholder="Enter your WhatsApp number">
        </div>
    </div>

    <!-- Step 2: Select Package -->
    <div class="section">
        <div class="section-title">
            <div class="step-number">2</div> Select Package
        </div>
        <div class="pkg-grid" id="pkgGrid">
            <div class="pkg-card" onclick="selectPkg(this, '260 Coin', 180)">
                <div class="pkg-name">260 Coin</div>
                <div class="pkg-price">৳180</div>
            </div>
            <div class="pkg-card" onclick="selectPkg(this, '840 Coin', 630)">
                <div class="pkg-name">840 Coin</div>
                <div class="pkg-price">৳630</div>
            </div>
            <div class="pkg-card" onclick="selectPkg(this, '1630 Coin', 1150)">
                <div class="pkg-name">1630 Coin</div>
                <div class="pkg-price">৳1150</div>
            </div>
            <div class="pkg-card" onclick="selectPkg(this, '50 Coin + Luis Suárez', 110)">
                <div class="pkg-name">50 Coin + Luis Suárez</div>
                <div class="pkg-price">৳110</div>
            </div>
            <div class="pkg-card" onclick="selectPkg(this, '100 Coin + IKER CASILLAS', 300)">
                <div class="pkg-name">100 Coin + IKER CASILLAS</div>
                <div class="pkg-price">৳300</div>
            </div>
        </div>
    </div>

    <!-- Step 3: Payment Method -->
    <div class="section">
        <div class="section-title">
            <div class="step-number">3</div> Payment Method
        </div>
        <div class="pay-grid">
            <div class="pay-method" onclick="selectPay(this, 'bKash')">bKash</div>
            <div class="pay-method" onclick="selectPay(this, 'Nagad')">Nagad</div>
        </div>

        <div id="payInstructionBox" class="payment-instructions" style="display: none;">
            Please send money to <span id="payMethodName"></span> number: <span>01733185830</span>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label>Sender Number / Last 4 Digits</label>
            <input type="text" id="lastDigit" placeholder="Enter last 4 digits of your send money number">
        </div>
        
        <button class="buy-btn" onclick="orderNow()">Buy Now</button>
    </div>
</div>

<script>
    let selectedPkg = "", selectedPrice = 0, selectedPay = "";

    function selectPkg(el, name, price) {
        document.querySelectorAll('.pkg-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        selectedPkg = name; 
        selectedPrice = price;
    }

    function selectPay(el, method) {
        document.querySelectorAll('.pay-method').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        selectedPay = method;

        let instructionBox = document.getElementById('payInstructionBox');
        let methodNameSpan = document.getElementById('payMethodName');
        instructionBox.style.display = 'block';
        methodNameSpan.innerText = method;
    }

    function orderNow() {
        let device = document.getElementById('device').value;
        let gmail = document.getElementById('gmail').value;
        let pass = document.getElementById('pass').value;
        let whatsapp = document.getElementById('whatsapp').value;
        let lastDigit = document.getElementById('lastDigit').value;

        if (!gmail || !pass || !whatsapp) {
            alert("Doya korey account info er shob field puron korun!");
            return;
        }
        if (!selectedPkg) {
            alert("Doya korey ekta package select korun!");
            return;
        }
        if (!selectedPay) {
            alert("Doya korey payment method select korun!");
            return;
        }
        if (!lastDigit) {
            alert("Doya korey last 4 digit ba sender number din!");
            return;
        }

        let msg = `*New Order - eFootball Coin Shop BD*%0A%0A` +
                  `📱 Device: ${device}%0A` +
                  `📧 Gmail: ${gmail}%0A` +
                  `🔑 Password: ${pass}%0A` +
                  `📞 WhatsApp: ${whatsapp}%0A%0A` +
                  `📦 Package: ${selectedPkg}%0A` +
                  `💰 Price: ${selectedPrice} TK%0A%0A` +
                  `💳 Payment Method: ${selectedPay}%0A` +
                  `🔢 Last 4 Digit: ${lastDigit}`;

        window.open(`https://wa.me/8801733185830?text=${msg}`, '_blank');
    }
</script>

</body>
</html>
