<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Efootball Coin</title>
    <style>
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .logo-container {
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .logo-container:active {
            transform: scale(0.95);
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-top: 20px;
        }
        h1 span {
            color: #ff3333;
        }
        p {
            color: #888;
            font-size: 1rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- লোগোতে ক্লিক করলে মেইন পেজে (index.html) চলে যাবে -->
    <div class="logo-container" onclick="goToMainPage()">
        <img src="your-logo.png" alt="Logo" width="80"> <!-- আপনার লোগো ইমেজ এখানে দিন -->
        <h1>Efootball <span>Coin</span></h1>
        <p>টপ আপ করতে ক্লিক করুন</p>
    </div>

    <script>
        function goToMainPage() {
            // প্রিমিয়াম ট্রানজিশন ইফেক্ট
            document.body.style.opacity = 0;
            document.body.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
                window.location.href = 'index.html'; // মেইন পেজের লিংক
            }, 500);
        }
    </script>

</body>
</html>
