<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khela Store - Top Up & Play On</title>
    <!-- Google Font: Bodoni Moda -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #111214;
            --card-bg: #1a1c1f;
            --accent-red: #ff3e3e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --success-green: #22c55e;
            --whatsapp-green: #25d366;
            --telegram-blue: #0088cc;
            --gmail-red: #ea4335;
            --phone-color: #38bdf8;
            --fb-blue: #1877f2;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 90px;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-area svg {
            width: 24px;
            height: 24px;
            fill: var(--accent-red);
        }
        .header h2 {
            font-family: 'Bodoni Moda', serif;
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-icon-btn, .login-top-btn {
            background: #1a1c1f;
            border: 1px solid #2a2d32;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .login-top-btn {
            border-color: rgba(255, 62, 62, 0.4);
            color: var(--accent-red);
        }

        /* Hero Telegram Banner */
        .hero-banner {
            background: #1a1c1f;
            border-radius: 15px;
            padding: 20px 15px;
            margin-bottom: 25px;
            border: 1px solid #2a2d32;
            text-align: center;
            position: relative;
        }
        .hero-banner h3 {
            color: #ffffff;
            font-size: 20px;
            margin: 0 0 5px 0;
            font-weight: 800;
        }
        .hero-banner p {
            color: var(--text-muted);
            font-size: 12px;
            margin: 0 0 15px 0;
        }
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #444;
            border-radius: 50%;
        }
        .dot.active {
            width: 20px;
            background: white;
            border-radius: 3px;
        }

        .games-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            position: relative;
            text-transform: uppercase;
        }
        .games-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 3px;
            background: var(--accent-red);
            margin: 6px auto 0 auto;
            border-radius: 2px;
        }

        /* Game Card Grid Layout */
        .game-card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .game-card {
            background: var(--card-bg);
            border: 1px solid #2a2d32;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            text-align: left;
        }
        .game-card:hover {
            border-color: var(--accent-red);
            transform: translateY(-2px);
        }
        .game-banner-img {
            width: 100%;
            height: 110px;
            background: #25282c;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
        }
        .game-info {
            padding: 12px;
        }
        .game-info h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
            color: white;
        }
        .game-info span {
            color: var(--text-muted);
            font-size: 11px;
        }

        /* Bottom Dock Navigation Bar */
        .bottom-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #16181b;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 999;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
        }
        .dock-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            font-size: 11px;
            transition: color 0.2s;
            text-decoration: none;
        }
        .dock-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-bottom: 3px;
        }
        .dock-item.active, .dock-item:hover {
            color: var(--accent-red);
        }

        /* Floating Support Button */
        .contact-float-btn {
            position: fixed;
            bottom: 75px;
            right: 20px;
            background-color: #1a1c1f;
            border: 1px solid #2a2d32;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 1000;
        }
        .contact-float-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Section -->

            <div class="game-info">
                <h4>VALORANT</h4>
                <span>1 options</span>
            </div>
        </div>
    </div>
</div>

<!-- Floating Support Button -->

    <button class="dock-item">
        <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.33 8.66 11.5 12 7.5l3.34 4L17 10.33 14.92 8H20v6z"/></svg>

    <button class="dock-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>

</div>

</body>
</html>
