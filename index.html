<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Football Coin Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>E-Football Coin Package</h1>
        
        <div class="package-list">
            <div class="package-card">
                <h3>260 Coin 🪙</h3>
                <p class="price">BDT 180</p>
                <button onclick="orderNow('260 Coin')">Buy Now</button>
            </div>

            <div class="package-card">
                <h3>840 Coin 🪙</h3>
                <p class="price">BDT 630</p>
                <button onclick="orderNow('840 Coin')">Buy Now</button>
            </div>

            <div class="package-card">
                <h3>1630 Coin 🪙</h3>
                <p class="price">BDT 1150</p>
                <button onclick="orderNow('1630 Coin')">Buy Now</button>
            </div>
        </div>
    </div>

    <script>
        function orderNow(packageName) {
            alert(packageName + " কেনার জন্য যোগাযোগ করুন!");
            // এখানে আপনি আপনার হোয়াটসঅ্যাপ বা অর্ডার লিঙ্কে রিডাইরেক্ট করাতে পারেন
        }
    </script>
</body>
</html>
