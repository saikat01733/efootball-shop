<style>
    :root {
        --bg-color: #111214;
        --card-bg: rgba(26, 28, 31, 0.75); /* Glass Background */
        --accent-red: #ff3e3e;
        --text-main: #ffffff;
        --text-muted: #a0a0a0;
        --success-green: #22c55e;
        --whatsapp-green: #25d366;
        --telegram-blue: #0088cc;
        --gmail-red: #ea4335;
        --phone-color: #38bdf8;
        --fb-blue: #1877f2;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        padding-bottom: 90px;
    }

    .container {
        max-width: 550px;
        margin: 0 auto;
    }

    .header {
        text-align: center;
        margin-bottom: 25px;
    }

    .header h2 {
        font-family: 'Bodoni Moda', serif;
        color: #ffffff;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin: 0;
        text-shadow: 0 2px 10px rgba(255, 62, 62, 0.3);
    }

    .badge-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 12px;
    }

    .badge-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .badge-safety {
        background-color: rgba(255, 62, 62, 0.15);
        border: 1px solid rgba(255, 62, 62, 0.4);
        color: var(--accent-red);
    }

    .badge-time {
        background-color: rgba(160, 160, 160, 0.15);
        border: 1px solid rgba(160, 160, 160, 0.3);
        color: var(--text-muted);
    }

    .badge-item svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
    }

    /* Glassmorphism Section Cards */
    .section {
        background: rgba(26, 28, 31, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .section-title {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        font-weight: bold;
        font-size: 16px;
    }

    .step-number {
        background: linear-gradient(135deg, var(--accent-red), #ff6b6b);
        width: 25px;
        height: 25px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 10px;
        font-size: 13px;
        color: white;
        box-shadow: 0 4px 10px rgba(255, 62, 62, 0.4);
    }

    .input-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        color: var(--text-muted);
        font-size: 13px;
    }

    /* Glass Inputs & Selects */
    input, select {
        width: 100%;
        padding: 12px;
        background: rgba(37, 40, 44, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        box-sizing: border-box;
        font-size: 14px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:focus, select:focus {
        border-color: var(--accent-red);
        background: rgba(37, 40, 44, 0.9);
        box-shadow: 0 0 15px rgba(255, 62, 62, 0.25);
        outline: none;
    }

    .pkg-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    /* Glass Package Cards with Smooth Scale & Ripple Animation */
    .pkg-card {
        background: rgba(37, 40, 44, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px;
        border-radius: 14px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .pkg-card:hover {
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-4px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .pkg-card:active {
        transform: scale(0.96);
    }

    .pkg-card.active {
        border-color: var(--accent-red);
        background: rgba(255, 62, 62, 0.12);
        box-shadow: 0 0 20px rgba(255, 62, 62, 0.25);
    }

    .pkg-name {
        font-weight: bold;
        font-size: 13px;
    }

    .pkg-price {
        color: var(--accent-red);
        font-weight: bold;
        margin-top: 6px;
        font-size: 15px;
    }

    .pkg-stock {
        color: var(--success-green);
        font-size: 11px;
        margin-top: 4px;
    }

    .pay-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    /* Glass Payment Methods */
    .pay-method {
        background: rgba(37, 40, 44, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 15px;
        border-radius: 14px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        cursor: pointer;
        font-weight: bold;
        position: relative;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pay-method:hover {
        transform: translateY(-3px);
        border-color: rgba(255, 255, 255, 0.25);
    }

    .pay-method:active {
        transform: scale(0.96);
    }

    .pay-method.active {
        border-color: var(--accent-red);
        background: rgba(255, 62, 62, 0.12);
        box-shadow: 0 0 20px rgba(255, 62, 62, 0.25);
    }

    .payment-instructions {
        background: rgba(37, 40, 44, 0.6);
        backdrop-filter: blur(10px);
        padding: 12px;
        border-radius: 12px;
        margin-top: 15px;
        font-size: 13px;
        color: #cbd5e1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .payment-instructions span {
        color: #38bdf8;
        font-weight: bold;
    }

    /* Glass Buttons (Copy, Buy, Social, etc.) with Smooth Click Animations */
    .copy-btn, .buy-btn, .social-btn, .google-btn, .contact-float-btn, .auth-tab-btn, .dock-item {
        position: relative;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .copy-btn:active, .buy-btn:active, .social-btn:active, .google-btn:active, .contact-float-btn:active, .auth-tab-btn:active, .dock-item:active {
        transform: scale(0.94) !important;
    }

    .copy-btn {
        background: rgba(59, 130, 246, 0.85);
        backdrop-filter: blur(10px);
        color: white;
        border: none;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
